name: Download from Commit & Save to Repo

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save-file:
    if: |
      contains(github.event.head_commit.message, 'download:') || 
      contains(github.event.head_commit.message, 'download-zip:')
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      # Optimized for GitHub's 100MB limit (using 95MB to stay safe)
      SPLIT_SIZE: "95m"
      MAX_FILE_SIZE_MB: 95
      
      # Safe connection limits for GitHub & Hugging Face
      ARIA2_SPLIT: 4           # 4 parallel connections max
      ARIA2_MAX_CONN: 4        # 4 connections per server
      ARIA2_MIN_SPLIT_SIZE: "20M"  # Split files >20MB
      ARIA2_MAX_CONCURRENT: 3      # Download 3 files simultaneously
      
      BATCH_SIZE: 10
      DOWNLOAD_DIR: "downloads"
      TEMP_DIR: "tmp_downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip unzip
          
          mkdir -p "${{ env.DOWNLOAD_DIR }}" "${{ env.TEMP_DIR }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Parse commit message and download files
        id: download
        run: |
          set -euo pipefail
          
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          
          if echo "$MSG" | grep -qiP 'download-zip:'; then
            MODE="zip"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download-zip:\s*\K.*' | head -1)
          elif echo "$MSG" | grep -qiP 'download:'; then
            MODE="normal"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download:\s*\K.*' | head -1)
          else
            echo "❌ No download command found"
            exit 1
          fi
          
          if [ -z "$URL_LINE" ]; then
            echo "❌ No URLs found"
            exit 1
          fi
          
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE"
          echo "URLs: $URL_LINE"
          
          # Download with optimized settings for GitHub/HuggingFace
          for URL in $URL_LINE; do
            [ -z "$URL" ] && continue
            
            if [[ ! "$URL" =~ ^https?:// ]]; then
              echo "⚠️ Skipping invalid URL: $URL"
              continue
            fi
            
            FILENAME=$(basename "$URL" | sed 's/?.*//')
            [ -z "$FILENAME" ] && FILENAME="download_$(date +%s)"
            
            echo "⬇️ Downloading $URL -> $FILENAME"
            
            # Optimized aria2 command for GitHub & HuggingFace
            aria2c \
              --split=${{ env.ARIA2_SPLIT }} \
              --max-connection-per-server=${{ env.ARIA2_MAX_CONN }} \
              --min-split-size=${{ env.ARIA2_MIN_SPLIT_SIZE }} \
              --max-concurrent-downloads=${{ env.ARIA2_MAX_CONCURRENT }} \
              --timeout=30 \
              --max-tries=5 \
              --retry-wait=5 \
              --continue=true \
              --console-log-level=error \
              --summary-interval=0 \
              --user-agent="Mozilla/5.0 (compatible; GitHubActions/1.0)" \
              --header="Accept: */*" \
              --dir="${{ env.TEMP_DIR }}" \
              --out="$FILENAME" \
              "$URL"
          done
          
          echo "✅ Downloads complete"

      - name: Process ZIP mode (if applicable)
        if: steps.download.outputs.mode == 'zip'
        run: |
          echo "📦 Creating zip archive"
          ARCHIVE_NAME="${{ env.TEMP_DIR }}/archive_$(date +%Y%m%d_%H%M%S).zip"
          
          if [ -n "$(ls -A ${{ env.TEMP_DIR }} 2>/dev/null)" ]; then
            zip -j "$ARCHIVE_NAME" ${{ env.TEMP_DIR }}/*
            echo "✅ Created archive"
          fi

      - name: Split large files (95MB threshold for GitHub 100MB limit)
        run: |
          LARGE_FILES=0
          SPLIT_SIZE_BYTES=$((95 * 1024 * 1024))  # 95MB threshold
          
          for FILE in ${{ env.TEMP_DIR }}/*; do
            [ -f "$FILE" ] || continue
            
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            
            if [ "$SIZE" -gt "$SPLIT_SIZE_BYTES" ]; then
              LARGE_FILES=$((LARGE_FILES + 1))
              SIZE_MB=$((SIZE / 1024 / 1024))
              CHUNKS=$(( (SIZE + 95*1024*1024 - 1) / (95*1024*1024) ))
              echo "✂️ Splitting $BASENAME (${SIZE_MB}MB) into ${CHUNKS} part(s)"
              
              zip -0 -s "${{ env.SPLIT_SIZE }}" \
                  "${{ env.DOWNLOAD_DIR }}/${BASENAME}.zip" \
                  -j "$FILE"
              
              PARTS=$(ls "${{ env.DOWNLOAD_DIR }}/${BASENAME}".* 2>/dev/null | wc -l)
              echo "  → Created $PARTS part(s) (each ≤95MB)"
            else
              cp "$FILE" "${{ env.DOWNLOAD_DIR }}/$BASENAME"
              echo "✅ Copied $BASENAME (${SIZE_MB:-$(($SIZE/1024/1024))}MB)"
            fi
          done
          
          echo "🔄 Split $LARGE_FILES large file(s)"

      - name: Clean up temp directory
        if: always()
        run: rm -rf "${{ env.TEMP_DIR }}"

      - name: Verify file sizes before commit
        run: |
          echo "📊 File size verification:"
          FAILED=0
          
          for FILE in ${{ env.DOWNLOAD_DIR }}/*; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              
              if [ "$SIZE" -gt 104857600 ]; then  # 100MB in bytes
                echo "❌ ERROR: $FILE is ${SIZE_MB}MB (exceeds GitHub 100MB limit!)"
                FAILED=1
              else
                echo "✅ $FILE: ${SIZE_MB}MB"
              fi
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Some files exceed GitHub's 100MB limit"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          if [ -z "$(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)" ]; then
            echo "📭 No new files to commit"
            exit 0
          fi
          
          mapfile -t ALL_FILES < <(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)
          TOTAL=${#ALL_FILES[@]}
          echo "📦 Total files to push: $TOTAL"
          
          if [ "$TOTAL" -eq 0 ]; then
            exit 0
          fi
          
          BATCH_SIZE=${{ env.BATCH_SIZE }}
          BATCH_NUM=0
          
          for (( i=0; i<TOTAL; i+=BATCH_SIZE )); do
            BATCH_NUM=$((BATCH_NUM + 1))
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")
            
            echo "🚀 Pushing batch $BATCH_NUM: files $((i+1))–$(( i + ${#BATCH[@]} )) of $TOTAL"
            
            git add "${BATCH[@]}"
            git commit -m "Add downloaded files - batch $BATCH_NUM [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            
            echo "✅ Batch $BATCH_NUM pushed"
            sleep 2
          done
          
          echo "🎉 Successfully pushed $TOTAL files in $BATCH_NUM batch(es)"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "❌ Workflow failed"
          git reset --hard HEAD 2>/dev/null || true
