name: Download from Commit & Save to Repo

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save-file:
    if: |
      contains(github.event.head_commit.message, 'download:') || 
      contains(github.event.head_commit.message, 'download-zip:')
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      SPLIT_SIZE: "95m"
      MAX_FILE_SIZE_MB: 95
      ARIA2_SPLIT: 4
      ARIA2_MAX_CONN: 4
      ARIA2_MIN_SPLIT_SIZE: "20M"
      ARIA2_MAX_CONCURRENT: 3
      BATCH_SIZE: 10
      DOWNLOAD_DIR: "downloads"
      TEMP_DIR: "tmp_downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip unzip bc
          mkdir -p "${{ env.DOWNLOAD_DIR }}" "${{ env.TEMP_DIR }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Creator info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👤 Created by: ElectronicBox"
          echo "🔗 https://github.com/ElectronicBox"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Parse commit message and download files
        id: download
        run: |
          echo "🔍 PARSING COMMIT MESSAGE"
          
          MSG=$(git log -1 --pretty=%B)
          echo "📝 Message: $MSG"
          
          if echo "$MSG" | grep -qiP 'download-zip:'; then
            MODE="zip"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download-zip:\s*\K.*' | head -1)
            echo "📦 Mode: ZIP Archive Mode"
          elif echo "$MSG" | grep -qiP 'download:'; then
            MODE="normal"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download:\s*\K.*' | head -1)
            echo "📄 Mode: Normal Download Mode"
          else
            echo "❌ No download command found"
            exit 1
          fi
          
          if [ -z "$URL_LINE" ]; then
            echo "❌ No URLs found"
            exit 1
          fi
          
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🔗 URLs to download: $(echo $URL_LINE | wc -w) URL(s)"
          
          echo "⬇️ DOWNLOADING FILES"
          
          for URL in $URL_LINE; do
            [ -z "$URL" ] && continue
            
            if [[ ! "$URL" =~ ^https?:// ]]; then
              echo "⚠️ Skipping invalid URL: $URL"
              continue
            fi
            
            FILENAME=$(basename "$URL" | sed 's/?.*//')
            [ -z "$FILENAME" ] && FILENAME="download_$(date +%s)"
            
            echo "📁 Downloading: $FILENAME"
            
            aria2c \
              --split=${{ env.ARIA2_SPLIT }} \
              --max-connection-per-server=${{ env.ARIA2_MAX_CONN }} \
              --min-split-size=${{ env.ARIA2_MIN_SPLIT_SIZE }} \
              --max-concurrent-downloads=${{ env.ARIA2_MAX_CONCURRENT }} \
              --timeout=30 \
              --max-tries=5 \
              --retry-wait=5 \
              --console-log-level=error \
              --summary-interval=0 \
              --quiet=true \
              --download-result=default \
              --user-agent="Mozilla/5.0 (compatible; GitHubActions/1.0)" \
              --header="Accept: */*" \
              --dir="${{ env.TEMP_DIR }}" \
              --out="$FILENAME" \
              "$URL" > /dev/null 2>&1
            
            if [ $? -eq 0 ]; then
              FILE_SIZE=$(du -h "${{ env.TEMP_DIR }}/$FILENAME" | cut -f1)
              echo "✅ Downloaded: $FILENAME ($FILE_SIZE)"
            else
              echo "❌ Failed to download: $FILENAME"
              exit 1
            fi
          done
          
          echo "✅ All downloads completed successfully!"

      - name: Process ZIP mode (if applicable)
        if: steps.download.outputs.mode == 'zip'
        run: |
          echo "📦 CREATING ZIP ARCHIVE"
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ARCHIVE_NAME="${{ env.TEMP_DIR }}/archive_${TIMESTAMP}.zip"
          
          if [ -n "$(ls -A ${{ env.TEMP_DIR }} 2>/dev/null)" ]; then
            FILE_COUNT=$(ls -1 ${{ env.TEMP_DIR }} | wc -l)
            echo "📁 Compressing $FILE_COUNT file(s)..."
            zip -j "$ARCHIVE_NAME" ${{ env.TEMP_DIR }}/*
            SIZE=$(du -h "$ARCHIVE_NAME" | cut -f1)
            echo "✅ Archive created: $ARCHIVE_NAME ($SIZE)"
          else
            echo "⚠️ No files to archive"
          fi

      - name: Split large files
        run: |
          echo "✂️ SPLITTING LARGE FILES"
          
          LARGE_FILES=0
          SPLIT_SIZE_BYTES=$((95 * 1024 * 1024))
          
          for FILE in ${{ env.TEMP_DIR }}/*; do
            [ -f "$FILE" ] || continue
            
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            SIZE_MB=$((SIZE / 1024 / 1024))
            
            if [ "$SIZE" -gt "$SPLIT_SIZE_BYTES" ]; then
              LARGE_FILES=$((LARGE_FILES + 1))
              CHUNKS=$(( (SIZE + 95*1024*1024 - 1) / (95*1024*1024) ))
              echo "✂️ Splitting $BASENAME (${SIZE_MB}MB) into $CHUNKS part(s)"
              
              zip -0 -s "${{ env.SPLIT_SIZE }}" \
                  "${{ env.DOWNLOAD_DIR }}/${BASENAME}.zip" \
                  -j "$FILE" > /dev/null 2>&1
              
              PARTS=$(ls "${{ env.DOWNLOAD_DIR }}/${BASENAME}".* 2>/dev/null | wc -l)
              echo "  ✅ Created $PARTS part(s)"
            else
              cp "$FILE" "${{ env.DOWNLOAD_DIR }}/$BASENAME"
              echo "✅ Copied $BASENAME (${SIZE_MB}MB)"
            fi
          done
          
          echo "✓ Split $LARGE_FILES large file(s)"

      - name: Clean up temp directory
        if: always()
        run: |
          rm -rf "${{ env.TEMP_DIR }}"

      - name: Verify file sizes before commit
        run: |
          echo "✅ VERIFYING FILE SIZES"
          
          FAILED=0
          for FILE in ${{ env.DOWNLOAD_DIR }}/*; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              BASENAME=$(basename "$FILE")
              
              if [ "$SIZE" -gt 104857600 ]; then
                echo "❌ $BASENAME: ${SIZE_MB}MB (EXCEEDS LIMIT!)"
                FAILED=1
              else
                echo "✅ $BASENAME: ${SIZE_MB}MB"
              fi
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Some files exceed GitHub's 100MB limit!"
            exit 1
          else
            echo "✅ All files within GitHub's 100MB limit"
          fi

      - name: Commit and push changes
        run: |
          echo "📤 PUSHING TO REPOSITORY"
          
          if [ -z "$(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)" ]; then
            echo "📭 No new files to commit"
            exit 0
          fi
          
          mapfile -t ALL_FILES < <(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)
          TOTAL=${#ALL_FILES[@]}
          TOTAL_SIZE=$(du -sh "${{ env.DOWNLOAD_DIR }}" | cut -f1)
          
          echo "📦 Total files: $TOTAL | Total size: $TOTAL_SIZE"
          
          BATCH_SIZE=${{ env.BATCH_SIZE }}
          BATCH_NUM=0
          TOTAL_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          
          for (( i=0; i<TOTAL; i+=BATCH_SIZE )); do
            BATCH_NUM=$((BATCH_NUM + 1))
            BATCH_END=$(( i + BATCH_SIZE ))
            [ $BATCH_END -gt $TOTAL ] && BATCH_END=$TOTAL
            
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")
            
            echo "📤 Batch $BATCH_NUM/$TOTAL_BATCHES: Files $((i+1))-$BATCH_END of $TOTAL"
            
            git add "${BATCH[@]}"
            git commit -m "Add downloaded files - batch $BATCH_NUM/$TOTAL_BATCHES [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" 2>&1 | grep -v "Already up to date" || true
            git push origin HEAD:"${{ github.ref_name }}"
            
            echo "  ✅ Batch $BATCH_NUM pushed"
            sleep 1
          done
          
          echo "🎉 Successfully pushed $TOTAL files in $TOTAL_BATCHES batches"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "❌ Workflow failed - resetting..."
          git reset --hard HEAD 2>/dev/null || true
