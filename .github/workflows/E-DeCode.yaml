name: Download from Commit & Save to Repo

on:
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save-file:
    if: |
      contains(github.event.head_commit.message, 'download:') || 
      contains(github.event.head_commit.message, 'download-zip:')
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    env:
      # Optimized for GitHub's 100MB limit (using 95MB to stay safe)
      SPLIT_SIZE: "95m"
      MAX_FILE_SIZE_MB: 95
      
      # Safe connection limits for GitHub & Hugging Face
      ARIA2_SPLIT: 4
      ARIA2_MAX_CONN: 4
      ARIA2_MIN_SPLIT_SIZE: "20M"
      ARIA2_MAX_CONCURRENT: 3
      
      BATCH_SIZE: 10
      DOWNLOAD_DIR: "downloads"
      TEMP_DIR: "tmp_downloads"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup environment with progress tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip unzip pv bc
          
          mkdir -p "${{ env.DOWNLOAD_DIR }}" "${{ env.TEMP_DIR }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create progress helper functions
          cat << 'EOF' >> ~/.bashrc
          progress_bar() {
              local current=$1
              local total=$2
              local width=50
              local percent=$((current * 100 / total))
              local filled=$((percent * width / 100))
              local empty=$((width - filled))
              
              printf "\r\033[1;36m│"
              printf "%${filled}s" | tr ' ' '█'
              printf "%${empty}s" | tr ' ' '░'
              printf "│ \033[1;33m%3d%%\033[0m" "$percent"
          }
          
          show_spinner() {
              local pid=$1
              local msg=$2
              local spin='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'
              local i=0
              while kill -0 $pid 2>/dev/null; do
                  i=$(( (i+1) % ${#spin} ))
                  printf "\r\033[1;36m%s\033[0m \033[1;33m%s\033[0m" "${spin:$i:1}" "$msg"
                  sleep 0.1
              done
              printf "\r\033[1;32m✓\033[0m %s\033[K\n" "$msg"
          }
          EOF
          source ~/.bashrc

      - name: Parse commit message and download files
        id: download
        run: |
          source ~/.bashrc
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 \033[1;33mPARSING COMMIT MESSAGE\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          MSG=$(git log -1 --pretty=%B)
          echo "📝 Message: $MSG"
          
          if echo "$MSG" | grep -qiP 'download-zip:'; then
            MODE="zip"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download-zip:\s*\K.*' | head -1)
            echo "📦 Mode: \033[1;36mZIP Archive Mode\033[0m"
          elif echo "$MSG" | grep -qiP 'download:'; then
            MODE="normal"
            URL_LINE=$(echo "$MSG" | grep -ioP 'download:\s*\K.*' | head -1)
            echo "📄 Mode: \033[1;36mNormal Download Mode\033[0m"
          else
            echo "❌ No download command found"
            exit 1
          fi
          
          if [ -z "$URL_LINE" ]; then
            echo "❌ No URLs found"
            exit 1
          fi
          
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo ""
          echo "🔗 URLs to download:"
          echo "$URL_LINE" | tr ' ' '\n' | nl -w2 -s') '
          echo ""
          
          # Download with progress
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⬇️ \033[1;33mDOWNLOADING FILES\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          URLS=($URL_LINE)
          TOTAL_URLS=${#URLS[@]}
          CURRENT=0
          
          for URL in $URL_LINE; do
            [ -z "$URL" ] && continue
            
            CURRENT=$((CURRENT + 1))
            echo ""
            echo "\033[1;37m[$CURRENT/$TOTAL_URLS]\033[0m 🌐 \033[1;34m$URL\033[0m"
            
            if [[ ! "$URL" =~ ^https?:// ]]; then
              echo "  ⚠️  \033[1;33mSkipping invalid URL\033[0m"
              continue
            fi
            
            FILENAME=$(basename "$URL" | sed 's/?.*//')
            [ -z "$FILENAME" ] && FILENAME="download_$(date +%s)"
            echo "  📁 Saving as: \033[1;32m$FILENAME\033[0m"
            
            # Download with aria2 (it has its own progress)
            aria2c \
              --split=${{ env.ARIA2_SPLIT }} \
              --max-connection-per-server=${{ env.ARIA2_MAX_CONN }} \
              --min-split-size=${{ env.ARIA2_MIN_SPLIT_SIZE }} \
              --max-concurrent-downloads=${{ env.ARIA2_MAX_CONCURRENT }} \
              --timeout=30 \
              --max-tries=5 \
              --retry-wait=5 \
              --continue=true \
              --console-log-level=warn \
              --summary-interval=1 \
              --user-agent="Mozilla/5.0 (compatible; GitHubActions/1.0)" \
              --header="Accept: */*" \
              --dir="${{ env.TEMP_DIR }}" \
              --out="$FILENAME" \
              "$URL" 2>&1 | grep -E "DOWNLOADED|#|ETA|DL" || true
          done
          
          echo ""
          echo "✅ \033[1;32mAll downloads completed successfully!\033[0m"

      - name: Process ZIP mode (if applicable)
        if: steps.download.outputs.mode == 'zip'
        run: |
          source ~/.bashrc
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 \033[1;33mCREATING ZIP ARCHIVE\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ARCHIVE_NAME="${{ env.TEMP_DIR }}/archive_${TIMESTAMP}.zip"
          
          if [ -n "$(ls -A ${{ env.TEMP_DIR }} 2>/dev/null)" ]; then
            FILE_COUNT=$(ls -1 ${{ env.TEMP_DIR }} | wc -l)
            echo "📁 Compressing $FILE_COUNT file(s)..."
            
            # Show progress during zip creation
            (zip -j "$ARCHIVE_NAME" ${{ env.TEMP_DIR }}/* 2>&1) | \
              while read line; do
                if [[ $line =~ adding: ]]; then
                  echo "  📎 $line"
                fi
              done
            
            SIZE=$(du -h "$ARCHIVE_NAME" | cut -f1)
            echo ""
            echo "✅ \033[1;32mArchive created:\033[0m $ARCHIVE_NAME ($SIZE)"
          else
            echo "⚠️  \033[1;33mNo files to archive\033[0m"
          fi

      - name: Split large files with visual progress
        run: |
          source ~/.bashrc
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✂️  \033[1;33mSPLITTING LARGE FILES\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          LARGE_FILES=0
          SPLIT_SIZE_BYTES=$((95 * 1024 * 1024))
          FILES=(${{ env.TEMP_DIR }}/*)
          TOTAL_FILES=${#FILES[@]}
          CURRENT_FILE=0
          
          for FILE in ${{ env.TEMP_DIR }}/*; do
            [ -f "$FILE" ] || continue
            
            CURRENT_FILE=$((CURRENT_FILE + 1))
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            SIZE_MB=$((SIZE / 1024 / 1024))
            
            echo ""
            echo "\033[1;37m[$CURRENT_FILE/$TOTAL_FILES]\033[0m 📄 \033[1;34m$BASENAME\033[0m (\033[1;33m${SIZE_MB}MB\033[0m)"
            
            if [ "$SIZE" -gt "$SPLIT_SIZE_BYTES" ]; then
              LARGE_FILES=$((LARGE_FILES + 1))
              CHUNKS=$(( (SIZE + 95*1024*1024 - 1) / (95*1024*1024) ))
              echo "  ⚠️  \033[1;33mFile exceeds 95MB limit\033[0m"
              echo "  🔪 Splitting into \033[1;36m$CHUNKS\033[0m part(s)..."
              
              # Show progress bar for splitting
              (
                zip -0 -s "${{ env.SPLIT_SIZE }}" \
                    "${{ env.DOWNLOAD_DIR }}/${BASENAME}.zip" \
                    -j "$FILE" 2>&1
              ) | while read line; do
                if [[ $line =~ "splitting" ]]; then
                  echo "    $line"
                fi
              done
              
              PARTS=$(ls "${{ env.DOWNLOAD_DIR }}/${BASENAME}".* 2>/dev/null | wc -l)
              echo "  ✅ \033[1;32mCreated $PARTS part(s)\033[0m (each ≤95MB)"
            else
              cp "$FILE" "${{ env.DOWNLOAD_DIR }}/$BASENAME"
              echo "  ✅ \033[1;32mCopied directly\033[0m (under 95MB limit)"
            fi
          done
          
          echo ""
          if [ "$LARGE_FILES" -gt 0 ]; then
            echo "✂️  \033[1;33mSplit $LARGE_FILES large file(s)\033[0m"
          else
            echo "✅ \033[1;32mNo large files needed splitting\033[0m"
          fi

      - name: Clean up temp directory
        if: always()
        run: |
          rm -rf "${{ env.TEMP_DIR }}"
          echo "🧹 \033[1;33mCleaned up temporary files\033[0m"

      - name: Verify file sizes before commit
        run: |
          source ~/.bashrc
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ \033[1;33mVERIFYING FILE SIZES\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          FAILED=0
          FILES=(${{ env.DOWNLOAD_DIR }}/*)
          TOTAL_FILES=${#FILES[@]}
          
          if [ $TOTAL_FILES -eq 0 ]; then
            echo "⚠️  \033[1;33mNo files to verify\033[0m"
            exit 0
          fi
          
          echo "📊 Checking $TOTAL_FILES file(s)..."
          echo ""
          
          for FILE in ${{ env.DOWNLOAD_DIR }}/*; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$((SIZE / 1024 / 1024))
              BASENAME=$(basename "$FILE")
              
              if [ "$SIZE" -gt 104857600 ]; then
                echo "  ❌ \033[1;31m$BASENAME\033[0m → \033[1;31m${SIZE_MB}MB\033[0m (EXCEEDS LIMIT!)"
                FAILED=1
              else
                # Color based on size
                if [ $SIZE_MB -gt 90 ]; then
                  echo "  ⚠️  \033[1;33m$BASENAME\033[0m → \033[1;33m${SIZE_MB}MB\033[0m (close to limit)"
                elif [ $SIZE_MB -gt 50 ]; then
                  echo "  📦 \033[1;36m$BASENAME\033[0m → \033[1;36m${SIZE_MB}MB\033[0m"
                else
                  echo "  ✅ \033[1;32m$BASENAME\033[0m → \033[1;32m${SIZE_MB}MB\033[0m"
                fi
              fi
            fi
          done
          
          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ \033[1;31mSome files exceed GitHub's 100MB limit!\033[0m"
            exit 1
          else
            echo "✅ \033[1;32mAll files are within GitHub's 100MB limit!\033[0m"
          fi

      - name: Commit and push changes with visual batches
        run: |
          source ~/.bashrc
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📤 \033[1;33mPUSHING TO REPOSITORY\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ -z "$(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)" ]; then
            echo "📭 \033[1;33mNo new files to commit\033[0m"
            exit 0
          fi
          
          mapfile -t ALL_FILES < <(git ls-files --others --modified --exclude-standard ${{ env.DOWNLOAD_DIR }}/)
          TOTAL=${#ALL_FILES[@]}
          echo "📦 \033[1;36mTotal files to push: $TOTAL\033[0m"
          echo ""
          
          if [ "$TOTAL" -eq 0 ]; then
            exit 0
          fi
          
          BATCH_SIZE=${{ env.BATCH_SIZE }}
          BATCH_NUM=0
          TOTAL_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          
          for (( i=0; i<TOTAL; i+=BATCH_SIZE )); do
            BATCH_NUM=$((BATCH_NUM + 1))
            BATCH_END=$(( i + BATCH_SIZE ))
            [ $BATCH_END -gt $TOTAL ] && BATCH_END=$TOTAL
            
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")
            BATCH_COUNT=${#BATCH[@]}
            
            echo "\033[1;37m┌─────────────────────────────────────────────────────────┐\033[0m"
            echo "\033[1;37m│\033[0m \033[1;36mBATCH $BATCH_NUM/$TOTAL_BATCHES\033[0m"
            echo "\033[1;37m│\033[0m 📁 Files: \033[1;33m$((i+1))-$BATCH_END\033[0m of \033[1;33m$TOTAL\033[0m"
            echo "\033[1;37m│\033[0m 🔢 Count: \033[1;32m$BATCH_COUNT\033[0m file(s)"
            echo "\033[1;37m└─────────────────────────────────────────────────────────┘\033[0m"
            
            # Show files being added (first few)
            echo "  📎 Adding:"
            for file in "${BATCH[@]:0:3}"; do
              echo "    • $(basename "$file")"
            done
            [ $BATCH_COUNT -gt 3 ] && echo "    • ... and $((BATCH_COUNT-3)) more"
            
            git add "${BATCH[@]}"
            git commit -m "Add downloaded files - batch $BATCH_NUM/$TOTAL_BATCHES [skip ci]"
            
            echo "  🔄 Pulling latest changes..."
            git pull --rebase origin "${{ github.ref_name }}" 2>&1 | grep -v "Already up to date" || true
            
            echo "  📤 Pushing batch $BATCH_NUM..."
            PUSH_OUTPUT=$(git push origin HEAD:"${{ github.ref_name }}" 2>&1)
            if [ $? -eq 0 ]; then
              echo "  ✅ \033[1;32mSuccessfully pushed!\033[0m"
            else
              echo "  ❌ \033[1;31mPush failed: $PUSH_OUTPUT\033[0m"
              exit 1
            fi
            
            echo ""
            sleep 2
          done
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 \033[1;32mSUCCESS!\033[0m \033[1;36mSuccessfully pushed $TOTAL files in $BATCH_NUM batch(es)\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Cleanup on failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ \033[1;31mWORKFLOW FAILED\033[0m"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          git reset --hard HEAD 2>/dev/null || true
          echo "🔄 \033[1;33mReset to last known good state\033[0m"
